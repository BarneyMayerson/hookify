name: hookify

x-app: &app
  build: .
  image: hookify-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: Europe/Berlin
  volumes:
    - storage:/app/storage
  networks: [shared]

services:
  app:
    <<: *app
    ports:
      - '127.0.0.1:8081:80'
    environment:
      TZ: Europe/Berlin
      RUN_MIGRATIONS: 'true'

  # queue:
  #   <<: *app
  #   command: php artisan queue:work --tries=3 --max-time=3600

  # scheduler:
  #   <<: *app
  #   command: php artisan schedule:work

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME}

volumes:
  storage:
